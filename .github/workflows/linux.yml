name: Linux build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Build, test and package Linux x64
        run: ./scripts/build-linux.sh linux-x64
      - uses: actions/upload-artifact@v7
        with:
          name: FoturTypingHelper-linux-x64
          path: |
            artifacts/FoturTypingHelper-*-linux-x64.tar.gz
            artifacts/SHA256SUMS-linux-x64.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: FoturTypingHelper-linux-x64-symbols
          path: artifacts/FoturTypingHelper-*-linux-x64-symbols.tar.gz
          if-no-files-found: error
